name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image ships the Android SDK with licences already
      # accepted, so there is no need for a third-party setup action. We only
      # have to guarantee the exact platform this project compiles against.
      - name: Install SDK platform 34
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Raw logs need admin rights to download, but annotations on a public
      # repo are readable by anyone, so re-emit compiler errors as annotations.
      - name: Surface build errors
        if: failure()
        run: |
          grep -E '^e: |[Ee]rror: |ERROR:' build.log | grep -v '^[[:space:]]*at ' | awk '!seen[$0]++' > errors.txt || true
          head -10 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '11,20p' errors.txt | while IFS= read -r l; do echo "::warning::$l"; done
          if [ ! -s errors.txt ]; then
            grep -A6 'What went wrong' build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      # Signed with the debug key, so this is a convenience build rather than a
      # distribution build. Failing here must not cost us the debug APK.
      - name: Build release APK
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Report signing certificate
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          DIGEST=$("$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          echo "::notice::APK signing certificate SHA-256: $DIGEST"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obd2-dashboard-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
