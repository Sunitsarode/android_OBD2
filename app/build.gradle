plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.obd2dash'
    compileSdk 34

    defaultConfig {
        applicationId "com.obd2dash"
        minSdk 23
        targetSdk 34
        // CI builds number themselves, so each APK is a newer version than the last.
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "1.0." + run
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        // Committed on purpose. Every build machine, including each fresh CI runner,
        // signs with this same key, so a new APK installs over the old one and keeps
        // settings, learned gears and trip history. The key is public, so it only
        // provides update continuity, not proof of who built the APK.
        shared {
            storeFile file('signing/obd2dash.keystore')
            storePassword 'obd2dash'
            keyAlias 'obd2dash'
            keyPassword 'obd2dash'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Android Auto projection
    implementation 'androidx.car.app:app:1.4.0'
}
